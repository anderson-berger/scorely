name: app-base

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
      # persiste login/config do Claude Code entre rebuilds do container
      - claude-config:/home/node/.claude
    working_dir: /workspace
    command: sleep infinity
    environment:
      DYNAMODB_ENDPOINT: http://localstack:4566
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Serverless v4 exige auth: key pessoal em .devcontainer/.env (gitignored) ou exportada no host
      SERVERLESS_ACCESS_KEY: ${SERVERLESS_ACCESS_KEY:-}
    depends_on:
      - localstack

  localstack:
    image: localstack/localstack:4.9
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: dynamodb
      PERSISTENCE: 1
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  node_modules:
  localstack-data:
  claude-config:
